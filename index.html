    <script>

        let sidebar = document.getElementById("sidebar");
        let overlay = document.getElementById("overlay");
        let body = document.querySelector("body");
        let btn = document.getElementById("btnToggle");
        let btnClose = document.getElementById("menu-close");
        let header = document.getElementById("header");
        let darkMod = document.getElementById("darkmod");
        let lightMod = document.getElementById("lightmod");

        function openMenu() {

            body.classList.add("overflow-hidden");
            overlay.classList.remove("hidden");
            sidebar.classList.remove("hidden");
            sidebar.classList.add("flex");
            btnClose.classList.remove("hidden");
            header.classList.remove("sticky");


        }

        function closeMenu() {

            body.classList.remove("overflow-hidden");
            overlay.classList.add("hidden");
            sidebar.classList.add("hidden");
            sidebar.classList.remove("flex");
            btnClose.classList.add("hidden");
            header.classList.add("sticky");

        }

        btn.addEventListener("click", openMenu);
        btnClose.addEventListener("click", closeMenu)

        window.addEventListener("resize", () => {

            if (window.innerWidth >= 1024) {
                closeMenu();
            }

        })


        if (!localStorage.theme) {
            if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
                document.documentElement.classList.add("dark"); 
                localStorage.theme = "dark";
            } else {
                document.documentElement.classList.remove("dark"); 
                localStorage.theme = "light"; 
            }
        } else {
            document.documentElement.classList.toggle("dark", localStorage.theme === "dark");
        }

        changeModColor();

        function changeModColor(){
            if(localStorage.theme == "dark"){
                lightMod.classList.remove("text-indigo-600");
                darkMod.classList.add("text-indigo-600");
            }else{
                darkMod.classList.remove("text-indigo-600");
                lightMod.classList.add("text-gray-900");
            }
        }

        function changeMod(mod){
            localStorage.theme = mod;
            changeModColor();
            location.reload();
        }

        darkMod.addEventListener("click", ()=>{
            changeMod("dark");
            
        });
        lightMod.addEventListener("click", ()=>{
            changeMod("light");
            
        });

        console.log(localStorage.theme);
        

        // localStorage.theme = "light";

    </script>
